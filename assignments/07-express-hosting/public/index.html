<html>
    <head>
        <title>Pokemon Directory</title>

        <link rel="stylesheet" href="style.css">

        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
        <script src="script.js"></script>
    </head>

    <body>

        <!-- pulls the pokemon logo as a jpg for the heading -->
        <header>
            <img class="headlogo" src="images/pokemon.png" alt="Pokemon Logo">
            <p>Look up your favorite Pokemon!</p>
        </header>

        <!-- Allows for a input to search a pokemon by name or number -->
        <div class="search">
            <input type="text" id="pokemonSearch"
                placeholder="Pokemon name/number">
            <button onclick="changePokemon()">Search</button>
        </div>

        <!-- Displays the Pokemon and stats -->
        <div class="card">
            <h2 id="pokemonName"></h2>
            <img id="pokemonImage" alt="Pokemon picture">

            <div id="canvasContainer"></div>
        </div>

    </body>
</html>
